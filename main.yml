name: Gerar instalador Z1UL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: python -m pip install -r requirements.txt

      - name: Baixar FFmpeg (com captura de janela do Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg.exe
          .\ffmpeg.exe -hide_banner -h filter=gfxcapture
          exit 0

      - name: Definir versao
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          "VERSAO=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path versao.txt -Value $v -NoNewline
          Set-Content -Path repo.txt -Value "${{ github.repository }}" -NoNewline

      - name: Compilar o app
        run: python -m PyInstaller --noconfirm --clean --windowed --name "Z1UL Gravador" --icon z1ul.ico --add-data "z1ul.ico;." --collect-all customtkinter --collect-all soundcard z1ul_gravador.py

      - name: Empacotar o app
        shell: pwsh
        run: |
          Copy-Item ffmpeg.exe "dist\Z1UL Gravador\ffmpeg.exe"
          python -c "import shutil; shutil.make_archive('Z1UL_Gravador_app', 'zip', 'dist/Z1UL Gravador')"

      - name: Compilar o instalador
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Z1UL_Setup --icon z1ul.ico --add-data "z1ul.ico;." --add-data "repo.txt;." --add-data "versao.txt;." instalador_z1ul.py

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: Z1UL GRAVADOR ${{ env.VERSAO }}
          make_latest: true
          files: |
            dist/Z1UL_Setup.exe
            Z1UL_Gravador_app.zip
            versao.txt
